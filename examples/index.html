<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elroot Dot Matrix examples</title>
    <style>
      body { margin: 0; padding: 24px; background: #000; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      figure { margin: 0; border: 1px solid #222; border-radius: 10px; padding: 8px; }
      canvas { display: block; width: 100%; aspect-ratio: 16 / 10; }
      figcaption { padding: 6px 2px 0; }
    </style>
  </head>
  <body>
    <h1>Elroot Dot Matrix</h1>
    <main id="grid"></main>
    <script type="module">
      import { arts, mountDots } from '../src/index.mjs'
      const catalog = await (await fetch('../catalog.json')).json()
      for (const art of catalog.arts) {
        const figure = document.createElement('figure')
        figure.innerHTML = '<canvas aria-hidden="true"></canvas><figcaption></figcaption>'
        figure.querySelector('figcaption').textContent = `${art.name}: ${art.shows}`
        document.getElementById('grid').append(figure)
        mountDots(figure.querySelector('canvas'), arts[art.id].default, {}, arts[art.id].prepare)
      }
    </script>
  </body>
</html>
